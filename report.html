<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Report — CUCIGANG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="report" class="min-h-screen">

<header class="px-5 md:px-8 py-5 flex items-center justify-between max-w-2xl mx-auto">
  <a href="index.html" class="flex items-center gap-2">
    <div class="w-9 h-9 rounded-xl bg-[#0057FF] flex items-center justify-center text-white font-bold">C</div>
    <span class="font-semibold text-sm">CUCIGANG</span>
  </a>
  <button id="themeToggle" class="w-9 h-9 rounded-full flex items-center justify-center card card-hover">
    <i data-lucide="moon" data-theme-icon class="w-4 h-4"></i>
  </button>
</header>

<main class="max-w-2xl mx-auto px-5 md:px-8 pb-20">
  <div class="mb-6 fade-in">
    <h1 class="text-2xl font-bold mb-1">Daily Sales Reporting</h1>
    <p class="text-sm text-[var(--color-text-soft)]">Takes less than a minute. Submit once per day per agent.</p>
  </div>

  <form id="reportForm" class="card rounded-[var(--radius-card)] p-6 md:p-8 space-y-5 fade-in">
    <div class="grid grid-cols-2 gap-4">
      <div class="col-span-1">
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Agent</label>
        <select id="agent" required class="w-full px-4 py-3 text-sm"></select>
      </div>
      <div class="col-span-1">
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Date</label>
        <input id="date" type="date" required class="w-full px-4 py-3 text-sm" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Fresh Leads</label>
        <input id="fresh" type="number" min="0" class="w-full px-4 py-3 text-sm" placeholder="0" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Freezing Leads</label>
        <input id="freezing" type="number" min="0" class="w-full px-4 py-3 text-sm" placeholder="0" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Calls Made</label>
        <input id="calls" type="number" min="0" required class="w-full px-4 py-3 text-sm" placeholder="0" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Connected</label>
        <input id="connected" type="number" min="0" required class="w-full px-4 py-3 text-sm" placeholder="0" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Booking</label>
        <input id="booking" type="number" min="0" required class="w-full px-4 py-3 text-sm" placeholder="0" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Sales (RM)</label>
        <input id="sales" type="number" min="0" required class="w-full px-4 py-3 text-sm" placeholder="0" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Follow Up</label>
        <input id="followup" type="number" min="0" class="w-full px-4 py-3 text-sm" placeholder="0" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">No Answer</label>
        <input id="noanswer" type="number" min="0" class="w-full px-4 py-3 text-sm" placeholder="0" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Rejected</label>
        <input id="rejected" type="number" min="0" class="w-full px-4 py-3 text-sm" placeholder="0" />
      </div>
    </div>

    <div>
      <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Remarks</label>
      <textarea id="remarks" rows="3" class="w-full px-4 py-3 text-sm resize-none" placeholder="Anything the manager should know..."></textarea>
    </div>

    <p id="formError" class="hidden text-sm text-[#EF4444] bg-[#EF4444]/10 rounded-xl px-4 py-3"></p>

    <button type="submit" class="btn btn-primary w-full py-3.5 font-semibold text-sm">
      Submit Report
    </button>
  </form>
</main>

<!-- Success overlay -->
<div id="successOverlay" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
  <div class="card modal-panel p-10 text-center max-w-xs mx-4 fade-in">
    <div class="w-16 h-16 rounded-full bg-[#16C47F]/15 text-[#16C47F] flex items-center justify-center mx-auto mb-4 text-3xl">✓</div>
    <p class="font-bold text-lg mb-1">Report Submitted Successfully</p>
    <p class="text-xs text-[var(--color-text-soft)]">Returning to dashboard…</p>
  </div>
</div>

<script type="module" src="assets/js/report.js"></script>
</body>
</html>
