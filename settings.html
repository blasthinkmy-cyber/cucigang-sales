<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings — CUCIGANG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="settings" class="min-h-screen">

<header class="px-5 md:px-8 py-5 flex items-center justify-between max-w-2xl mx-auto">
  <a href="dashboard.html" class="flex items-center gap-2 text-sm font-medium text-[var(--color-text-soft)]">
    <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to dashboard
  </a>
  <button id="themeToggle" class="w-9 h-9 rounded-full flex items-center justify-center card card-hover">
    <i data-lucide="moon" data-theme-icon class="w-4 h-4"></i>
  </button>
</header>

<main class="max-w-2xl mx-auto px-5 md:px-8 pb-20">
  <div class="mb-6 fade-in">
    <h1 class="text-2xl font-bold mb-1">Settings</h1>
    <p class="text-sm text-[var(--color-text-soft)]">Only managers should edit this page. No coding required — everything here maps directly to the SETTINGS sheet.</p>
  </div>

  <form id="settingsForm" class="card rounded-[var(--radius-card)] p-6 md:p-8 space-y-5 fade-in mb-6">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Company Name</label>
        <input id="companyName" type="text" class="w-full px-4 py-3 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Currency</label>
        <input id="currency" type="text" maxlength="4" class="w-full px-4 py-3 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Monthly Target</label>
        <input id="monthlyTarget" type="number" min="0" class="w-full px-4 py-3 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Working Days</label>
        <input id="workingDays" type="number" min="1" max="31" class="w-full px-4 py-3 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Working Hours / Day</label>
        <input id="workingHours" type="number" min="1" max="24" class="w-full px-4 py-3 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Dashboard Refresh (seconds)</label>
        <input id="refreshSeconds" type="number" min="5" class="w-full px-4 py-3 text-sm" />
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium mb-1.5 text-[var(--color-text-soft)]">Theme</label>
      <select id="themePref" class="w-full px-4 py-3 text-sm">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary w-full py-3.5 font-semibold text-sm">
      Save Settings
    </button>
  </form>

  <div class="card rounded-[var(--radius-card)] p-6 md:p-8 fade-in">
    <div class="flex items-center justify-between mb-4">
      <p class="text-sm font-semibold">Agent List</p>
      <span class="text-xs text-[var(--color-text-soft)]">Read-only preview</span>
    </div>
    <div id="agentList" class="space-y-2"></div>
    <p class="text-xs text-[var(--color-text-soft)] mt-4">Add, edit, or remove agents directly in the AGENTS sheet — the dropdown on the Daily Report page reads from it automatically.</p>
  </div>

  <div class="mt-6 text-center">
    <button id="resetMock" class="text-xs text-[var(--color-text-soft)] underline">Reset demo data</button>
  </div>
</main>

<script type="module" src="assets/js/settings.js"></script>
</body>
</html>
